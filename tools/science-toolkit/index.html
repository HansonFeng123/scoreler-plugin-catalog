<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Science Toolkit</title>
<style>
:root{color-scheme:light dark;font:15px/1.5 system-ui,sans-serif;color:var(--scoreler-text,#263d31);background:var(--scoreler-bg,#f3f6f2)}
*{box-sizing:border-box}body{margin:0;padding:clamp(12px,3vw,28px)}h1{margin:0 0 4px;font-size:clamp(21px,4vw,30px)}p{margin:6px 0}small,.muted{color:var(--scoreler-muted,#496354)}
button,input,select{font:inherit;border:1px solid var(--scoreler-line,#b8c9be);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--scoreler-accent,#507c66);outline-offset:2px}
button.primary{background:var(--scoreler-accent,#507c66);color:var(--scoreler-onAccent,#fff)}
.panel{border:1px solid var(--scoreler-line,#b8c9be);background:var(--scoreler-surface,#fff);border-radius:12px;padding:14px;margin-block:14px}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-block:16px}
label{display:grid;gap:4px}input{min-width:0;width:100%}output{display:block;font-weight:650;margin-top:12px}

.scroll{overflow:auto;padding:4px}
.table{display:grid;grid-template-columns:repeat(18,minmax(40px,1fr));gap:4px;min-width:790px}
.marker{text-align:center;align-self:center;font-size:11px}
.element{display:grid;gap:0;min-height:50px;padding:3px;text-align:center;line-height:1.22}
.element span{font-size:11px}.element strong{font-size:16px}.element.series{border-style:dashed}
.element.selected{outline:2px solid var(--scoreler-accent,#507c66);outline-offset:-3px}
.element.dim{opacity:.35}
.element .property-value{font-size:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.table[data-mode=property] .element{min-height:58px}
.table[data-mode=property] .element.selected{outline-color:currentColor}
.table .element:focus-visible{outline:2px solid var(--scoreler-accent,#507c66);outline-offset:2px;position:relative;z-index:1}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin-block:8px;font-size:12px}
.legend-scale{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.legend-swatches{display:flex;overflow:hidden;border-radius:4px;border:1px solid var(--scoreler-line,#b8c9be)}
.legend-swatches span,.legend-missing span{display:inline-block;width:16px;height:12px}
.legend-missing{display:inline-flex;align-items:center;gap:6px}
[data-heat="0"]{--heat-fill:#e7f3ff;--heat-ink:#14283e}
[data-heat="1"]{--heat-fill:#b8dbf9;--heat-ink:#14283e}
[data-heat="2"]{--heat-fill:#78b7ec;--heat-ink:#14283e}
[data-heat="3"]{--heat-fill:#2c6ba7;--heat-ink:#fff}
[data-heat="4"]{--heat-fill:#173d6b;--heat-ink:#fff}
.legend-swatches span{background:var(--heat-fill)}
#elements .element[data-heat]:not([data-heat=missing]){
  background:var(--heat-fill)!important;color:var(--heat-ink)!important
}
#elements [data-heat=missing]{
  background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--scoreler-line,#b8c9be) 35%,transparent) 4px 6px),var(--scoreler-surface,#fff)!important
}
.info{display:flex;flex-wrap:wrap;align-items:center;gap:12px 25px}
.info h2{font-size:18px;margin:0}.info div{display:grid}
.info .properties{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(135px,100%),1fr));gap:10px 16px;flex-basis:100%;padding-top:10px;border-top:1px solid var(--scoreler-line,#b8c9be);margin:0}
.properties dt{font-size:12px;color:var(--scoreler-muted,#496354)}.properties dd{font-weight:650;margin:0}

.layout{display:grid;gap:14px;grid-template-columns:minmax(170px,1fr) minmax(0,2fr)}
.menu{display:grid;gap:6px;align-content:start}.menu button{text-align:left}
.menu button[aria-pressed=true]{outline:2px solid var(--scoreler-accent,#507c66);outline-offset:-3px;font-weight:650}
.workspace{margin:0}.workspace h2{margin:0}.equation{font:600 24px/1.5 system-ui;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin-block:14px}
@media(max-width:580px){.layout{grid-template-columns:1fr}.menu{grid-template-columns:repeat(auto-fit,minmax(135px,1fr))}}
.workspace h3{margin:0;font-size:18px}
#elements .toolbar output{margin:0}
body{max-width:1320px;margin:auto}
[hidden]{display:none!important}
.tool-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0;border-bottom:1px solid var(--scoreler-line,#b8c9be);padding-bottom:12px}
.tool-tabs [aria-selected=true]{font-weight:650}
.tool{min-width:0;outline-offset:4px}
.tool h2{margin:0;font-size:20px}
.tool-heading{margin-bottom:14px}
.unit-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:600px}
.unit-fields select{min-width:0;width:100%}
.unit-action{margin-top:14px}
#unit-result{font-size:20px;overflow-wrap:anywhere}
@media(max-width:390px){.unit-fields{grid-template-columns:1fr}}
</style>
</head>

    <header class="tool-heading"><h2></h2><p class="muted"></p></header>
    <section class="panel">
      <div class="unit-fields">
        <label><span id="category-label"></span><select id="category"></select></label>
        <label><span id="amount-label"></span><input id="amount" type="number" step="any" value="1"></label>
        <label><span id="from-label"></span><select id="from-unit"></select></label>
        <label><span id="to-label"></span><select id="to-unit"></select></label>
      </div>
      <button class="unit-action" id="swap" type="button"></button>
      <output id="unit-result" aria-live="polite" aria-atomic="true"></output>
    </section>
    <p><small>NIST · SP 811</small></p>
  </section>
</main>

<script>
const en = window.ScorelerPlugin?.locale !== 'zh-CN';
const t = (english, chinese) => en ? english : chinese;
document.documentElement.lang = t('en', 'zh-CN');
document.title = t('Science Toolkit', '科学工具箱');
document.querySelector('h1').textContent = document.title;
document.querySelector('.suite-heading p').textContent = t('Offline references and calculators for science class.', '离线科学参考与计算工具。');
const tabList = document.querySelector('.tool-tabs');
tabList.setAttribute('aria-label', t('Science tools', '科学工具'));
const tabs = [...tabList.querySelectorAll('[role="tab"]')];
const toolLabels = [
  t('Periodic table', '元素周期表'),
  t('Physics equations', '物理公式'),
  t('Unit converter', '单位换算'),
];
function showTool(index) {
  tabs.forEach((tab, i) => {
    const active = i === index;
    tab.setAttribute('aria-selected', String(active));
    tab.tabIndex = active ? 0 : -1;
    tab.classList.toggle('primary', active);
    document.getElementById(tab.getAttribute('aria-controls')).hidden = !active;
  });
}
tabs.forEach((tab, index) => {
  tab.textContent = toolLabels[index];
  tab.addEventListener('click', () => showTool(index));
  tab.addEventListener('keydown', event => {
    let next;
    switch (event.key) {
      case 'ArrowLeft': next = (index + tabs.length - 1) % tabs.length; break;
      case 'ArrowRight': next = (index + 1) % tabs.length; break;
      case 'Home': next = 0; break;
      case 'End': next = tabs.length - 1; break;
      default: return;
    }
    event.preventDefault();
    showTool(next);
    tabs[next].focus();
  });
});

    ["Ds","darmstadtium","𫟼","[281]"],
    ["Rg","roentgenium","𬬭","[282]"],
    ["Cn","copernicium","鿔","[285]"],
    ["Nh","nihonium","鉨","[286]"],
    ["Fl","flerovium","𫓧","[290]"],
    ["Mc","moscovium","镆","[290]"],
    ["Lv","livermorium","𫟷","[293]"],
    ["Ts","tennessine","鿬","[294]"],
    ["Og","oganesson","鿫","[294]"]];
  const labels = en ? {
    title:'Periodic table', search:'Search by name, symbol or atomic number', number:'Atomic number',
    weight:'Abridged standard atomic weight', isotope:'Isotope mass number', period:'Period', group:'Group',
    series:['Lanthanoids','Actinoids'], none:'No matching elements', count:'matching elements'
  } : {
    title:'元素周期表', search:'搜索名称、符号或原子序数', number:'原子序数',
    weight:'简化标准原子量', isotope:'同位素质量数', period:'周期', group:'族',
    series:['镧系','锕系'], none:'未找到匹配元素', count:'个匹配元素'
  };
  const root = document.getElementById('elements');
  root.querySelector('.scroll').setAttribute('aria-label', labels.title);
  root.querySelector('h2').textContent = labels.title;
  root.querySelector('#element-search-label').textContent = labels.search;
  const table = root.querySelector('.table');
  const detail = root.querySelector('.info');
  const search = root.querySelector('input');
  const status = root.querySelector('output');
  const mode = root.querySelector('#property-mode');
  const legend = root.querySelector('#property-legend');
  const unavailable = t('No data', '暂无数据');
  const properties = [
    {id:'melting',name:t('Melting point','熔点'),unit:'K'},
    {id:'boiling',name:t('Boiling point','沸点'),unit:'K'},
    {id:'ionization',name:t('First ionization energy','第一电离能'),unit:'eV'},
    {id:'electronegativity',name:t('Electronegativity (Pauling)','电负性（鲍林标度）'),unit:''},
    {id:'radius',name:t('Atomic radius (van der Waals)','原子半径（范德华）'),unit:'pm'},
    {id:'affinity',name:t('Electron affinity','电子亲和能'),unit:'eV'}
  ];
  const propertyRows = JSON.parse(document.getElementById('element-properties').textContent);
  const numberFormat = new Intl.NumberFormat(document.documentElement.lang, {maximumFractionDigits:3,useGrouping:false});
  const formatValue = (value, property) => value === null ? '—' :
    numberFormat.format(value) + (property.unit ? ' ' + property.unit : '');
  const modeLabel = property => property.name + (property.unit ? ' · ' + property.unit : '');
  root.querySelector('#property-mode-label').textContent = t('Color by','着色方式');
  mode.append(new Option(t('Element symbols','元素符号'), ''));
  properties.forEach(property => mode.append(new Option(modeLabel(property), property.id)));
  root.querySelector('#property-missing-label').textContent = unavailable;
  root.querySelector('#element-sources').textContent = t(
    'Atomic weights from IUPAC (2022). Other values from NCBI PubChem. Phase-change values can depend on pressure or allotrope.',
    '标准原子量来源于 IUPAC（2022），其余数据来源于 NCBI PubChem。相变温度可能受压力或同素异形体影响。'
  );
  const periods = [2,10,18,36,54,86,118];
  const buttons = [];
  let selected;
  function put(node,row,column) {
    node.style.gridRow = row;
    node.style.gridColumn = column;
    table.append(node);
  }
  function marker(text,row,column) {
    const node = document.createElement('span');
    node.className = 'marker muted';
    node.textContent = text;
    put(node,row,column);
  }
  for (let group=1; group<=18; group++) marker(group,1,group);
  marker('57–71',7,3);
  marker('89–103',8,3);
  marker('57–71',10,'1 / 4');
  marker('89–103',11,'1 / 4');
  function select(item) {
    selected?.classList.remove('selected');
    selected?.setAttribute('aria-pressed','false');
    selected = item.button;
    selected.classList.add('selected');
    selected.setAttribute('aria-pressed','true');
    detail.replaceChildren();
    const heading = document.createElement('h2');
    heading.textContent = item.symbol + ' · ' + (en ? item.name : item.chinese + ' / ' + item.name);
    detail.append(heading);
    const weightLabel = item.weight.startsWith('[') ? labels.isotope : labels.weight;
    const values = [[labels.number,item.number],[weightLabel,item.weight],[labels.period,item.period]];
    values.push(item.series < 0 ? [labels.group,item.group] : [en ? 'Series' : '系列',labels.series[item.series]]);
    for (const [label,value] of values) {
      const cell = document.createElement('div');
      const key = document.createElement('small');
      key.textContent = label;
      const text = document.createElement('strong');
      text.textContent = value;
      cell.append(key,text);
      detail.append(cell);
    }
    const list = document.createElement('dl');
    list.className = 'properties';
    properties.forEach((property, index) => {
      const cell = document.createElement('div');
      const key = document.createElement('dt');
      const value = document.createElement('dd');
      key.textContent = property.name;
      value.textContent = item.properties[index] === null ? unavailable : formatValue(item.properties[index], property);
      cell.append(key,value);
      list.append(cell);
    });
    detail.append(list);
  }
  elements.forEach(([symbol,name,chinese,weight],index) => {
    const number = index+1;
    const period = periods.findIndex(end => number<=end)+1;
    const offset = number-(periods[period-2] ?? 0);
    const series = number>=57&&number<=71 ? 0 : number>=89&&number<=103 ? 1 : -1;
    const group = period===1 && offset===2 ? 18 :
      period>=2 && period<=3 && offset>=3 ? offset+10 :
      period>=6 && offset>=18 ? offset-14 : offset;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = series < 0 ? 'element' : 'element series';
    button.setAttribute('aria-pressed','false');
    const indexLabel = document.createElement('span');
    indexLabel.textContent = number;
    const symbolLabel = document.createElement('strong');
    symbolLabel.textContent = symbol;
    const valueLabel = document.createElement('span');
    valueLabel.className = 'property-value';
    valueLabel.hidden = true;
    button.append(indexLabel,symbolLabel,valueLabel);
    put(button,series < 0 ? period+1 : 10+series,series < 0 ? group : offset+1);
    const item = {button,symbol,name,chinese,weight,number,period,group,series,valueLabel,properties:propertyRows[index]};
    buttons.push(item);
    button.addEventListener('click',() => select(item));
  });
  function colorTable() {
    const index = properties.findIndex(property => property.id === mode.value);
    const property = properties[index];
    const values = property ? propertyRows.map(row => row[index]).filter(Number.isFinite) : [];
    const low = Math.min(...values), high = Math.max(...values);
    table.dataset.mode = property ? 'property' : 'symbols';
    legend.hidden = !property;
    if (property) {
      root.querySelector('#property-low').textContent = formatValue(low, property);
      root.querySelector('#property-high').textContent = formatValue(high, property);
    }
    for (const item of buttons) {
      const label = item.number + ' ' + item.symbol + ' ' + (en ? item.name : item.chinese);
      item.valueLabel.hidden = !property;
      if (!property) {
        delete item.button.dataset.heat;
        item.button.setAttribute('aria-label', label);
        item.button.removeAttribute('title');
        continue;
      }
      const value = item.properties[index];
      const ratio = high === low ? 0 : (value - low) / (high - low);
      item.button.dataset.heat = value === null ? 'missing' : String(Math.min(4, Math.floor(ratio * 5)));
      item.valueLabel.textContent = value === null ? '—' : numberFormat.format(value);
      const description = label + ' · ' + property.name + ' · ' + (value === null ? unavailable : formatValue(value, property));
      item.button.setAttribute('aria-label', description);
      item.button.title = description;
    }
  }
  mode.addEventListener('change',colorTable);
  colorTable();
  function matches() {
    const query = search.value.trim().toLowerCase();
    const numeric = /^\d+$/.test(query);
    const filtered = buttons.filter(item => {
      const match = numeric ? item.number===Number(query) :
        [item.symbol,item.name,item.chinese].some(value => value.toLowerCase().includes(query));
      item.button.classList.toggle('dim',!match);
      return match;
    });
    status.textContent = query ? filtered.length ? filtered.length+' '+labels.count : labels.none : '';
    return filtered;
  }
  search.addEventListener('input',matches);
  search.addEventListener('keydown',event => {
    if (event.key !== 'Enter') return;
    const filtered = matches();
    const query = search.value.trim().toLowerCase();
    const exact = filtered.find(item => [item.symbol,item.name,item.chinese,String(item.number)].some(value => value.toLowerCase()===query));
    const item = exact ?? filtered[0];
    if (item) {
      select(item);
      item.button.focus();
    }
  });
  select(buttons[0]);
}

// Physics equations
{
  const f = (symbol,english,chinese,unit,domain) => ({symbol,name:t(english,chinese),unit,domain});
  const mass=f('m','Mass','质量','kg','positive');
  const time=f('t','Time','时间','s','positive');
  const speed=f('v','Speed','速率','m/s','nonnegative');
  const accel=f('a','Acceleration','加速度','m/s²');
  const energy=f('E','Energy','能量','J');
  const formulas = [
    ['Final velocity','末速度','v = u + at','m/s','Constant acceleration in one dimension. Use signed velocities.','一维匀加速运动，速度带正负号。',[f('u','Initial velocity','初速度','m/s'),accel,time],(u,a,t)=>u+a*t],
    ['Displacement','位移','s = ut + ½at²','m','Constant acceleration in one dimension.','适用于一维匀加速运动。',[f('u','Initial velocity','初速度','m/s'),accel,time],(u,a,t)=>u*t+a*t*t/2],
    ['Newton’s second law','牛顿第二定律','F = ma','N','Net force along the direction of the signed acceleration.','合力方向与加速度方向一致。',[mass,accel],(m,a)=>m*a],
    ['Kinetic energy','动能','Eₖ = ½mv²','J','Classical mechanics at speeds well below the speed of light.','适用于速率远小于光速的经典力学。',[mass,speed],(m,v)=>m*v*v/2],
    ['Momentum','动量','p = mv','kg·m/s','One component of momentum. Velocity can be signed.','动量的一个分量，速度带正负号。',[mass,f('v','Velocity','速度','m/s')],(m,v)=>m*v],
    ['Work','功','W = Fd cos θ','J','Constant force. Enter the angle between force and displacement in degrees.','恒力与位移的夹角用度数输入。',[f('F','Force','力','N','nonnegative'),f('d','Displacement magnitude','位移大小','m','nonnegative'),f('θ','Angle','夹角','°','angle')],(F,d,a)=>F*d*(a===90?0:Math.cos(a*Math.PI/180))],
    ['Power','功率','P = E / t','W','Average power over a time interval.','一段时间内的平均功率。',[energy,time],(E,t)=>E/t],
    ['Density','密度','ρ = m / V','kg/m³','Mass divided by volume.','质量除以体积。',[mass,f('V','Volume','体积','m³','positive')],(m,V)=>m/V],
    ['Wave speed','波速','v = fλ','m/s','Enter frequency and wavelength in the same medium.','输入同一介质中的频率与波长。',[f('f','Frequency','频率','Hz','positive'),f('λ','Wavelength','波长','m','positive')],(f,l)=>f*l],
    ['Ohm’s law','欧姆定律','V = IR','V','Use for an ohmic resistor. Current can be signed.','适用于欧姆电阻，电流带正负号。',[f('I','Current','电流','A'),f('R','Resistance','电阻','Ω','nonnegative')],(I,R)=>I*R],
    ['Electrical power','电功率','P = VI','W','Use voltage across and current through the same component.','使用同一元件两端的电压与流经它的电流。',[f('V','Voltage','电压','V'),f('I','Current','电流','A')],(V,I)=>V*I],
    ['Heating','热量','Q = mcΔT','J','Assumes constant specific heat and no phase change.','假设比热容恒定且没有相变。',[mass,f('c','Specific heat','比热容','J/(kg·K)','positive'),f('ΔT','Temperature change','温度变化','K')],(m,c,d)=>m*c*d],
    ['Ideal gas pressure','理想气体压强','p = nRT / V','Pa','Use kelvin for absolute temperature. R = 8.314462618 J/(mol·K).','绝对温度用开尔文。R = 8.314462618 J/(mol·K)。',[f('n','Amount','物质的量','mol','positive'),f('T','Temperature','温度','K','positive'),f('V','Volume','体积','m³','positive')],(n,T,V)=>n*8.314462618*T/V],
  ];
  const root = document.getElementById('equations');
  const el = name => root.querySelector(name);
  el('.tool-heading h2').textContent=t('Physics equations','物理公式');
  el('header p').textContent=t('Choose an equation, then enter values in the units shown.','选择公式，然后按所示单位输入数值。');
  el('.primary').textContent=t('Calculate','计算');
  const menu=el('.menu'), fields=el('.fields'), output=el('output');
  menu.setAttribute('aria-label', t('Equations', '公式'));
  let chosen=0;
  const buttons=formulas.map(([english,chinese],index)=>{
    const button=document.createElement('button');
    button.type='button';
    button.textContent=t(english,chinese);
    button.addEventListener('click',()=>show(index));
    menu.append(button);
    return button;
  });
  function show(index) {
    chosen=index;
    buttons.forEach((button,i)=>button.setAttribute('aria-pressed',String(i===index)));
    const [english,chinese,equation,,note,zhNote,params]=formulas[index];
    el('.workspace h3').textContent=t(english,chinese);
    el('.equation').textContent=equation;
    el('.conditions').textContent=t(note,zhNote);
    output.textContent='';
    fields.replaceChildren();
    for (const {symbol,name,unit,domain} of params) {
      const label=document.createElement('label');
      const input=document.createElement('input');
      input.type='number';
      input.step='any';
      input.required=true;
      if (domain) input.min='0';
      if (domain==='angle') input.max='180';
      label.append(symbol+' · '+name+' ('+unit+')',input);
      fields.append(label);
    }
  }
  fields.addEventListener('input',()=>{output.textContent='';});
  function calculate() {
    if (Array.from(fields.querySelectorAll('input')).some(input => !input.reportValidity())) return;
    const [,,,unit,,,params,solve]=formulas[chosen];
    const values=Array.from(fields.querySelectorAll('input'),input=>input.valueAsNumber);
    if (values.some((value,index)=>!Number.isFinite(value) || (params[index].domain==='positive' && value<=0))) {
      output.textContent=t('Enter valid values. Fields that require a positive quantity must be above zero.','请输入有效数值。要求为正数的量必须大于零。');
      return;
    }
    const result=solve(...values);
    output.textContent=Number.isFinite(result) ? Number(result.toPrecision(8))+' '+unit : t('Result is outside the calculator’s range.','结果超出计算器范围。');
  }
  el('.primary').addEventListener('click',calculate);
  fields.addEventListener('keydown',event=>{ if(event.key==='Enter') calculate(); });
  show(0);
}

// Unit converter
{
  const root = document.getElementById('units');
  const get = id => document.getElementById(id);
  const category = get('category');
  const amount = get('amount');
  const from = get('from-unit');
  const to = get('to-unit');
  const swap = get('swap');
  const output = get('unit-result');
  const temperature = {
    '°C': [x => x + 273.15, x => x - 273.15],
    '°F': [x => (x + 459.67) * 5/9, x => (x - 273.15) * 9/5 + 32],
    'K': [x => x, x => x],
  };
  // Factors convert each unit to the category's SI base or coherent derived unit.
  const categories = {
    length: [t('Length', '长度'), {m:1, cm:0.01, mm:0.001, 'µm':1e-6, nm:1e-9, km:1000, in:0.0254, ft:0.3048, mi:1609.344}],
    area: [t('Area', '面积'), {'m²':1, 'cm²':1e-4, 'mm²':1e-6, 'km²':1e6, ha:1e4, 'ft²':0.3048**2}],
    volume: [t('Volume', '体积'), {L:1e-3, mL:1e-6, 'cm³':1e-6, 'm³':1, 'US gal':0.003785411784}],
    mass: [t('Mass', '质量'), {kg:1, g:0.001, mg:1e-6, 'µg':1e-9, lb:0.45359237, oz:0.45359237/16}],
    time: [t('Time', '时间'), {s:1, ms:0.001, min:60, h:3600, d:86400}],
    speed: [t('Speed', '速度'), {'m/s':1, 'km/h':1/3.6, mph:0.44704, 'ft/s':0.3048}],
    pressure: [t('Pressure', '压强'), {Pa:1, kPa:1000, MPa:1e6, bar:1e5, atm:101325}],
    energy: [t('Energy', '能量'), {J:1, kJ:1000, Wh:3600, kWh:3.6e6, 'calₜₕ':4.184, 'kcalₜₕ':4184}],
    temperature: [t('Temperature', '温度'), temperature],
  };
  const format = value => String(Number(value.toPrecision(10)));
  const setOptions = (select, options) => {
    select.replaceChildren(...options.map(([value,label]) => new Option(label,value)));
  };
  function updateResult() {
    const value = amount.valueAsNumber;
    const units = categories[category.value][1];
    const isTemperature = units === temperature;
    amount.setAttribute('aria-invalid', 'false');
    if (!Number.isFinite(value)) {
      output.textContent = '';
      return;
    }

    let result;
    if (isTemperature) {
      const kelvin = temperature[from.value][0](value);
      if (kelvin < 0) {
        amount.setAttribute('aria-invalid', 'true');
        output.textContent = t('Enter a temperature at or above absolute zero.', '请输入不低于绝对零度的温度。');
        return;
      }
      result = from.value === to.value ? value : temperature[to.value][1](kelvin);
    } else {
      result = value * (units[from.value] / units[to.value]);
    }
    output.textContent = Number.isFinite(result)
      ? format(result) + ' ' + to.value
      : t('Result is outside the calculator’s range.', '结果超出计算器范围。');
  }
  function loadUnits() {
    const options = Object.keys(categories[category.value][1]).map(unit => [unit,unit]);
    setOptions(from,options);
    setOptions(to,options);
    to.selectedIndex = 1;
    updateResult();
  }
  root.querySelector('h2').textContent = toolLabels[2];
  root.querySelector('.tool-heading p').textContent = t('Choose a quantity and two units. The result updates as you type.', '选择物理量和单位，输入时会自动更新结果。');
  get('category-label').textContent = t('Quantity', '物理量');
  get('amount-label').textContent = t('Value', '数值');
  get('from-label').textContent = t('From', '原单位');
  get('to-label').textContent = t('To', '目标单位');
  swap.textContent = t('Swap units', '交换单位');
  setOptions(category,Object.entries(categories).map(([key,[label]]) => [key,label]));
  category.addEventListener('change',loadUnits);
  for (const input of [from,to]) input.addEventListener('change',updateResult);
  amount.addEventListener('input',updateResult);
  swap.addEventListener('click',() => {
    [from.value,to.value] = [to.value,from.value];
    updateResult();
  });
  loadUnits();
}
</script>
</body>
</html>
